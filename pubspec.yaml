name: mes_notes
description: Application de prise de notes Flutter avec SQLite
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  cupertino_icons: ^1.0.6
  crypto: ^3.0.3
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# Configuration de l'icône de l'application
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/appicon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFF8E1"
  adaptive_icon_foreground: "assets/appicon.png"

# Configuration de l'écran de lancement (splash natif)
flutter_native_splash:
  color: "#FFF8E1"
  image: assets/splash_icon.png
  android: true
  ios: true
  android_12:
    color: "#FFF8E1"
    image: assets/splash_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/login_image.jpg
    - assets/icon.png
    - assets/splash_icon.png
    - assets/appicon.png